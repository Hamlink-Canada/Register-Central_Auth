[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"
[project]
name = "rpt-central-auth"
version = "1.0.1"
description = "Modular gRPC credential lookup for repeater registrars"
requires-python = ">=3.13"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = [
  "rpt-protobuf[grpc] @ git+https://github.com/Hamlink-Canada/rpt_protobuf.git@main",
  "rpt-common[postgres] @ git+https://github.com/Hamlink-Canada/pyCommon.git@main",
  "dynaconf>=3.3.5,<4", "grpcio-health-checking>=1.85.1,<2",
  "cachetools>=8,<9", "prometheus-client>=0.24,<1",
]
[project.scripts]
rpt-central-auth = "rpt_central_auth.cli:main"
rpt-central-auth-health = "rpt_central_auth.probe:main"
[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17.4,<0.18", "build>=1.6,<2"]
integration = ["Flask>=3.1.3,<4", "confluent-kafka>=2.16,<3"]

[tool.uv.sources]
rpt-protobuf = {path = "../rpt_protobuf", editable = true}
rpt-common = {path = "../pyCommon", editable = true}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
